<div [formGroup]="entityForm" class="mat-padding flex flex-col">
    <mat-form-field appearance="fill" class="mat-block">
        <mat-label translate>model.name</mat-label>
        <input matInput formControlName="name" required placeholder="{{ 'model.name' | translate }}">
        <mat-error *ngIf="entityForm.get('name').hasError('required')">
            {{ 'model.name-required' | translate }}
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="mat-block">
        <mat-label translate>feature.version-control</mat-label>
        <input matInput formControlName="modelVersion" placeholder="{{ 'feature.version-control' | translate }}"
            [attr.aria-label]="'feature.version-control' | translate">
    </mat-form-field>

    <mat-form-field appearance="fill" class="mat-block">
        <mat-label translate>model.description</mat-label>
        <textarea matInput formControlName="description" rows="4" placeholder="{{ 'model.description' | translate }}"
            [attr.aria-label]="'model.description' | translate"></textarea>
    </mat-form-field>
</div>
