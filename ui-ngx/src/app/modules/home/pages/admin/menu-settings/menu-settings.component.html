<div [formGroup]="menuSettingsForm">
  <mat-card appearance="outlined" class="settings-card">
    <mat-card-header>
      <mat-card-title>
        <span class="mat-headline-5" translate>admin.permission-menu-allocation</span>
      </mat-card-title>
    </mat-card-header>
    <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async"></mat-progress-bar>
    <div style="height: 4px;" *ngIf="!(isLoading$ | async)"></div>
    <mat-card-content style="padding-top: 16px;">
      <form (submit)="$event.preventDefault()">
        <fieldset [disabled]="(isLoading$ | async)">
          <div fxLayout="column">
            <mat-form-field class="mat-block">
              <mat-label>{{ 'admin.menu-settings.role' | translate }}</mat-label>
              <mat-select [(value)]="authority" (selectionChange)="authorityChanged($event)">
                <mat-option *ngFor="let auth of authorities" [value]="auth">
                  {{ 'admin.menu-settings.authority.' + auth.toLocaleLowerCase() | translate }}
                </mat-option>
              </mat-select>
            </mat-form-field>
            <div class="flex justify-end -mt-2 mb-2 xs:flex-col xs:items-stretch">
              <button mat-raised-button type="button" (click)="toggleExpandAll()">
                {{(isAllExpanded ? 'action.collapse-all' : 'action.expand-all') | translate}}
              </button>
            </div>

            <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
              <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle matTreeNodePadding>
                <button mat-icon-button type="button" disabled></button>
                <mat-checkbox class="checklist-leaf-node"
                              [checked]="checklistSelection.isSelected(node.id)" [disabled]="isNodeDisabled(node)"
                              (change)="leafItemSelectionToggle(node)">{{node.name | translate}}</mat-checkbox>
              </mat-tree-node>

              <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
                <button mat-icon-button type="button" matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name" (click)="$event.stopPropagation()">
                  <mat-icon class="mat-icon-rtl-mirror">
                    {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                  </mat-icon>
                </button>
                <mat-checkbox [checked]="checklistSelection.isSelected(node.id)"
                              [indeterminate]="descendantsPartiallySelected(node)"
                              [disabled]="isNodeDisabled(node)" (change)="itemSelectionToggle(node)">{{node.name |
                  translate}}</mat-checkbox>
              </mat-tree-node>
            </mat-tree>
          </div>
        </fieldset>
      </form>
    </mat-card-content>
    <mat-card-actions class="flex items-center justify-end gap-4 xs:flex-col xs:items-stretch">
      <button mat-raised-button type="button" (click)="reset()" [disabled]="(isLoading$ | async)">{{'action.reset'
        | translate}}
      </button>
      <button mat-raised-button color="primary" type="button" (click)="save()"
              [disabled]="menuSettingsForm.invalid || !menuSettingsForm.dirty || (isLoading$ | async)">{{'action.save'
        | translate}}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
