<mat-toolbar color="primary">
  <h2>{{ 'device.validate-assets-device-config' | translate }}</h2>
  <span class="flex-1"></span>
  <button mat-icon-button (click)="cancel()" type="button">
    <mat-icon class="material-icons">close</mat-icon>
  </button>
</mat-toolbar>

<div mat-dialog-content>
  <form [formGroup]="form">
    <tb-file-input
      formControlName="assetFile"
      accept=".csv"
      [label]="'device.asset-file' | translate"
      [dropLabel]="'import.drop-file-csv-or' | translate"
      required
    ></tb-file-input>
    <tb-file-input
      formControlName="deviceFile"
      accept=".csv"
      [label]="'device.device-file' | translate"
      [dropLabel]="'import.drop-file-csv-or' | translate"
      required
    ></tb-file-input>
    <tb-file-input
      formControlName="relationFile"
      accept=".csv"
      [label]="'device.relation-file' | translate"
      [dropLabel]="'import.drop-file-csv-or' | translate"
      required
    ></tb-file-input>
  </form>
</div>

<div mat-dialog-actions class="tb-dialog-actions">
  <button mat-button (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-raised-button color="primary" (click)="validate()" [disabled]="form.invalid">{{ 'action.ok' | translate }}</button>
</div>
