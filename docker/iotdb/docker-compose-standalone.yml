# Apache IoTDB 1.3.7 单机版 —— ThingsBoard 历史/最新时序存储
#
# 启动:  docker compose -f docker/iotdb/docker-compose-standalone.yml up -d
# 停止:  docker compose -f docker/iotdb/docker-compose-standalone.yml down
# CLI :  docker exec -it iotdb /iotdb/sbin/start-cli.sh -h 127.0.0.1 -p 6667 -u root -pw root
#
# 对应 ThingsBoard 配置(环境变量或 thingsboard.yml):
#   DATABASE_TS_TYPE=iotdb
#   DATABASE_TS_LATEST_TYPE=iotdb            # 或 redis(继续用 Redis 做最新值)
#   IOTDB_NODE_URLS=127.0.0.1:6667
#   IOTDB_USER=root  IOTDB_PASSWORD=root
#   IOTDB_TTL_MS=31536000000                  # 历史保留 365 天
#   IOTDB_TTL_FAIL_FAST=true                  # TTL 设置失败则阻止带病启动
#   TB_EDQS_SYNC_ENABLED=false                # latest=iotdb 时必须关闭
#   TB_EDQS_API_SUPPORTED=false               # latest=iotdb 时必须关闭
#
# 调优说明详见 docs/iotdb/IoTDB时序存储集成设计与压测报告.md 附录 C。
# 下方 environment 中标注 [调优] 的项：写入频率/点数越高，越应调大。

services:
  iotdb:
    image: apache/iotdb:1.3.7-standalone
    container_name: iotdb
    hostname: iotdb
    restart: always
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /opt/iotdb-custom/entrypoint-standalone.sh
    mem_limit: ${IOTDB_MEMORY_LIMIT:-96g}
    mem_reservation: ${IOTDB_MEMORY_RESERVATION:-80g}
    memswap_limit: ${IOTDB_MEMORY_SWAP_LIMIT:-104g}
    stop_grace_period: 120s
    ports:
      - "6667:6667"          # 客户端 RPC 端口(SessionPool 连接)
    ulimits:                 # 高并发写必需，避免 "too many open files"
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # 官方 1.3.7 启动脚本不读取 MAX_HEAP_SIZE；由自定义入口写入两个 *-env.sh。
      # 72G DataNode 会得到约 63G 堆 + 9G 直接内存，配合 4G ConfigNode，
      # 为 96G 容器硬上限保留约 20G 原生内存和文件缓存余量。
      - DATANODE_MEMORY_SIZE=${DATANODE_MEMORY_SIZE:-72G}
      - CONFIGNODE_MEMORY_SIZE=${CONFIGNODE_MEMORY_SIZE:-4G}

      # ---- RPC ----
      - dn_rpc_address=0.0.0.0
      - dn_rpc_port=6667
      - dn_internal_address=127.0.0.1         # 单机必须走 127.0.0.1，勿设主机名(否则内部端口 bind 失败崩溃)

      # ---- [调优] 写入并发 / 吞吐(iotdb-common.properties，可用同名 env 覆盖) ----
      # 写入并发的真正边界。默认 5.0，建议 ≈ 逻辑核数 ÷ 2；写入频率/设备数越高越应调大。
      - data_region_per_data_node=4
      # 刷盘线程数。0=自动(=CPU 核数)；高频写、磁盘快时可显式调大。
      - flush_thread_count=0
      # 后台合并线程数。写入越密集，小文件越多，越需要更多合并线程(默认约核数/2)。
      - compaction_thread_count=4
      # 每个 page 的最大点数。同测点高频连续写时调大(如 20000~50000)可提升压缩比与写吞吐。
      - max_number_of_points_in_page=10000
      # WAL 模式：ASYNC(默认，高吞吐) / SYNC(每写落盘，强可靠但慢) / DISABLE(最快，断电丢数据)。
      # 本方案客户端为纯内存攒批(可容忍少量丢点)，服务端保持 ASYNC 即可。
      - wal_mode=ASYNC
      # [调优][高序列基数必改] 设备数×测点数(序列总条数)大时(如 >80万条)，默认 schema
      # 内存配额会触发 "507 Too many timeseries in memory" 拒写。
      # datanode_memory_proportion = 存储:查询:schema:共识:流:空闲 (默认 3:3:1:1:1:1)
      # schema_memory_proportion   = schemaRegion:schemaCache:partitionCache (默认 5:4:1)
      # 实测(5000 设备×500 测点=250 万条序列): schema 段需 4/12 才不触发 507
      # (内部有 ~75% 安全水位, 4G×(4/12)×0.6×0.75≈610MB > 250万×~190B≈475MB ✓)。
      # 更优做法：为同构设备建「设备模板」(create schema template ... aligned)，
      # 元数据不再逐条物化，schema 内存近乎归零且写入更快(实测 +25%~50%)，见文档附录 C。
      - datanode_memory_proportion=3:2:4:1:1:1
      - schema_memory_proportion=6:3:1
    volumes:
      - ./bin/entrypoint-standalone.sh:/opt/iotdb-custom/entrypoint-standalone.sh:ro
      - iotdb-data:/iotdb/data                # 用 named volume，避开 macOS 文件共享层的磁盘开销
      - iotdb-logs:/iotdb/logs

volumes:
  iotdb-data:
  iotdb-logs:
