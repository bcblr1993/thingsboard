# Apache IoTDB 1.3.7 集群版(3C3D) —— 单个节点(1 ConfigNode + 1 DataNode)的部署单元
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 重要：IoTDB 集群只支持 host / overlay 网络，不支持 bridge。               │
# │ 官方推荐 3C3D = 3 台机器，每台跑 1 ConfigNode + 1 DataNode。              │
# │ 本文件是「一台机器」的部署单元，请在 3 台机器上各放一份并按下方步骤启动。│
# └──────────────────────────────────────────────────────────────────────────┘
#
# 部署步骤(3 台机器 node1/node2/node3, 假设 IP 分别为 10.0.0.1 / .2 / .3):
#   1) 三台都安装 docker，放置本文件。
#   2) 每台设置环境变量(或写同目录 .env):
#        export NODE_IP=<本机IP>            # 例: node1 填 10.0.0.1
#        export SEED_CN=10.0.0.1:10710       # 固定为 node1(种子 ConfigNode) 的 IP:10710
#   3) 先在 node1(种子) 启动:  docker compose -f docker-compose-cluster.yml up -d
#      待 node1 就绪后，再在 node2、node3 依次启动同样命令。
#   4) 校验集群:
#        docker exec -it iotdb-datanode /iotdb/sbin/start-cli.sh -h $NODE_IP -p 6667 -u root -pw root
#        IoTDB> show cluster;     # 应看到 3 个 ConfigNode + 3 个 DataNode 处于 Running
#
# ThingsBoard 连接集群(任意/全部 DataNode 的 RPC 地址, 逗号分隔, 客户端会自动路由/故障转移):
#   IOTDB_NODE_URLS=10.0.0.1:6667,10.0.0.2:6667,10.0.0.3:6667
#
# 单机本地仅想「体验」集群: 需为每个实例错开全部端口(6 容器)，且内存吃紧，不建议;
# 功能验证请用 docker-compose-standalone.yml。集群务必多机部署。
#
# 调优参数含义见 docs/iotdb/…报告.md 附录 C（与单机相同，写入频率/点数越高越调大）。

services:
  confignode:
    image: apache/iotdb:1.3.7-confignode
    container_name: iotdb-confignode
    network_mode: host                       # 集群必须 host 网络
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # 注意: MAX_HEAP_SIZE/MAX_DIRECT_MEMORY_SIZE 在 1.3.x 镜像中不生效(脚本不读取)。
      # 集群纯 ConfigNode 镜像(单进程)用官方 MEMORY_SIZE 总预算, 堆/堆外自动按档位分配。
      - MEMORY_SIZE=4G                        # ConfigNode 仅管元数据/共识(约得 3.2G 堆 + 0.8G 堆外)
      - cn_internal_address=${NODE_IP}        # 本机 IP
      - cn_internal_port=10710
      - cn_consensus_port=10720
      - cn_seed_config_node=${SEED_CN}        # 种子 ConfigNode = node1_IP:10710(三台一致)
      # ---- 副本因子(仅集群首次 bootstrap 生效, 三台必须一致) ----
      - schema_replication_factor=3           # 元数据 3 副本(=ConfigNode 数)
      - data_replication_factor=2             # 数据 2 副本(高可用与开销的平衡; 要更高可用可设 3)
    volumes:
      - iotdb-cn-data:/iotdb/data
      - iotdb-cn-logs:/iotdb/logs

  datanode:
    image: apache/iotdb:1.3.7-datanode
    container_name: iotdb-datanode
    network_mode: host
    restart: always
    depends_on:
      - confignode
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      # ---- [调优] 内存: 写入频率/驻留序列越多越应调大(独占机 = 物理内存 - 8~16G) ----
      # MEMORY_SIZE 为 DataNode 总预算, 堆自动 = 预算×档位系数(<16G→4/5, 16~128G→7/8),
      # 余量作堆外。MAX_HEAP_SIZE/MAX_DIRECT_MEMORY_SIZE 是无效变量, 勿用。
      - MEMORY_SIZE=12G                       # 示例值(约得 9.6G 堆); 生产按容量水位表选择
      # ---- RPC / 内部端口 ----
      - dn_rpc_address=${NODE_IP}
      - dn_rpc_port=6667
      - dn_internal_address=${NODE_IP}
      - dn_internal_port=10730
      - dn_mpp_data_exchange_port=10740
      - dn_schema_region_consensus_port=10750
      - dn_data_region_consensus_port=10760
      - dn_seed_config_node=${SEED_CN}        # 指向种子 ConfigNode
      # ---- [调优] 写入并发/吞吐(同单机, 频率/点数越高越调大) ----
      - data_region_per_data_node=8           # 写入并发真正边界, 建议≈逻辑核数÷2
      - flush_thread_count=0                   # 0=自动(=核数)
      - compaction_thread_count=8              # 写入越密集小文件越多, 越需更多合并线程
      - max_number_of_points_in_page=10000     # 同测点高频连续写可调大(20000~50000)
      - wal_mode=ASYNC                         # 吞吐优先; 断电零丢改 SYNC(注意: IoTConsensus 依赖 WAL, 不可 DISABLE)
      # [高序列基数必改] 序列总条数(设备×测点)大时防 507 拒写; 同构设备更推荐设备模板(见文档附录 C)
      - datanode_memory_proportion=3:2:4:1:1:1
      - schema_memory_proportion=6:3:1
    volumes:
      - iotdb-dn-data:/iotdb/data
      - iotdb-dn-logs:/iotdb/logs

volumes:
  iotdb-cn-data:
  iotdb-cn-logs:
  iotdb-dn-data:
  iotdb-dn-logs:
