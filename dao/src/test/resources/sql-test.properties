database.ts.type=sql
database.ts_latest.type=sql

sql.ts_inserts_executor_type=fixed
sql.ts_inserts_fixed_thread_pool_size=200
sql.ts_key_value_partitioning=MONTHS
#
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.order_by.default_null_ordering=last
spring.jpa.properties.hibernate.jdbc.log.warnings=false

spring.jpa.show-sql=false

spring.jpa.hibernate.ddl-auto=none
# 默认值即原有的 Testcontainers + PostgreSQL 16.6 行为，不设置这些变量时与改造前完全一致。
# 需要针对外部数据库（如 KingbaseES）跑同一套测试时，用系统属性或环境变量覆盖，例如：
#   金仓 pg 兼容模式：
#     mvn test -pl dao -DTB_TEST_DB_DRIVER=org.postgresql.Driver \
#       -DTB_TEST_DB_URL='jdbc:postgresql://<host>:54321/<db>' \
#       -DTB_TEST_DB_USERNAME=<user> -DTB_TEST_DB_PASSWORD=<pass>
#   金仓 oracle 兼容模式（连接串必须带 ora_input_emptystr_isnull=off，
#   且测试库需先安装 schema-entities-kingbase-oracle-addon.sql）：
#     mvn test -pl dao -DTB_TEST_DB_DRIVER=org.postgresql.Driver \
#       -DTB_TEST_DB_URL='jdbc:postgresql://<host>:54321/<db>?options=-c%20ora_input_emptystr_isnull%3Doff' \
#       -DTB_TEST_DB_USERNAME=<user> -DTB_TEST_DB_PASSWORD=<pass>
# 外部数据库不会触发 Testcontainers 的 TC_INITFUNCTION，需先按 PostgreSqlInitializer 的脚本顺序初始化测试库。
spring.datasource.username=${TB_TEST_DB_USERNAME:postgres}
spring.datasource.password=${TB_TEST_DB_PASSWORD:postgres}
spring.datasource.url=${TB_TEST_DB_URL:jdbc:tc:postgresql:16.6:///thingsboard?TC_DAEMON=true&TC_TMPFS=/testtmpfs:rw&?TC_INITFUNCTION=org.thingsboard.server.dao.PostgreSqlInitializer::initDb}
spring.datasource.driverClassName=${TB_TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
# 默认 16 与改造前一致；指向 max_connections 较小的外部库时可调低
spring.datasource.hikari.maximumPoolSize=${TB_TEST_DB_POOL_SIZE:16}

service.type=monolith

